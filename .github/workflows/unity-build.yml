name: Unity 6 — Linux Build

on:
  push:
    branches: [ release ]      # build only when you push to 'release'
    tags:     [ 'v*' ]         # and on version tags like v0.3.0
  workflow_dispatch:            # allow manual runs from the Actions tab

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: "6000.0.0f1"   # <-- set to match ProjectSettings/ProjectVersion.txt
  PROJECT_PATH: "."

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # If you use Git LFS, uncomment:
        # with:
        #   lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('ProjectSettings/**','**/*.cs','**/*.asset','**/*.meta') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-
            Library-

      - name: Unity Build (Linux)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:   ${{ env.UNITY_VERSION }}
          projectPath:    ${{ env.PROJECT_PATH }}
          targetPlatform: StandaloneLinux64
          buildMethod:    CIBuildEntryCLI.BuildCI
          customParameters: >
            -buildTarget StandaloneLinux64
            -outputPath Builds/Linux/SmolbeanPlanet.x86_64
            -development false

      - name: Package artifact
        run: |
          cd Builds/Linux
          zip -r ../../Smolbean-StandaloneLinux64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smolbean-StandaloneLinux64
          path: Smolbean-StandaloneLinux64.zip
          compression-level: 0
          retention-days: 7
