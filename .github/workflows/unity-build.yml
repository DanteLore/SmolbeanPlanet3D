name: Unity Linux Build and Upload

on:
  push:
    branches: [ release ]
  workflow_dispatch:

permissions:
  id-token: write   # needed for OIDC
  contents: read    # checkout repo

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('**/Packages/manifest.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Unity Build (Linux)
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneLinux64

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActions-Smolbeanplanet-Upload
          aws-region: eu-west-1

      - name: Upload build to S3
        run: |
          aws s3 cp build/StandaloneLinux64/linux.zip \
            s3://dantelore.com/smolbeanplanet/linux/linux.zip \
            --cache-control "public,max-age=60"

      - name: Get CloudFront distribution ID by domain
        id: cf
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[?@=='dantelore.com']].Id | [0]" \
            --output text)
          echo "dist_id=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cf.outputs.dist_id }} \
            --paths "/smolbeanplanet/*"
