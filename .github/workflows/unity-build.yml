name: Unity 6 — Multi-platform Build + S3 + CloudFront

on:
  push:
    branches: [ release ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  PROJECT_PATH: "."

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unity Build (Linux)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.1.12f1
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: StandaloneLinux64
          buildMethod: CIBuildEntryCLI.BuildCI

      - name: Package Linux zip
        run: |
          cd Builds/Linux
          zip -r ../../linux.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActions-Smolbeanplanet-Upload
          aws-region: eu-west-1

      - name: Upload to S3 (Linux)
        run: aws s3 cp linux.zip s3://dantelore.com/smolbeanplanet/linux/linux.zip --cache-control "public,max-age=60"

      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[?@=='dantelore.com']].Id | [0]" \
            --output text)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/smolbeanplanet/*"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Unity Build (Windows)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.1.12f1
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: StandaloneWindows64
          buildMethod: CIBuildEntryCLI.BuildCI

      - name: Run Inno Setup to create installer
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Move installer into Builds/Windows
        run: |
          mkdir -p Builds\Windows
          move Output\SmolbeanPlanetSetup.exe Builds\Windows\SmolbeanPlanetSetup.exe

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActions-Smolbeanplanet-Upload
          aws-region: eu-west-1

      - name: Upload to S3 (Windows)
        run: aws s3 cp Builds/Windows/SmolbeanPlanetSetup.exe s3://dantelore.com/smolbeanplanet/windows/SmolbeanPlanetSetup.exe --cache-control "public,max-age=60"

      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[?@=='dantelore.com']].Id | [0]" \
            --output text)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/smolbeanplanet/*"

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unity Build (Mac)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.1.12f1
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: StandaloneOSX
          buildMethod: CIBuildEntryCLI.BuildCI

      - name: Create DMG
        run: ./create-dmg.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActions-Smolbeanplanet-Upload
          aws-region: eu-west-1

      - name: Upload to S3 (Mac)
        run: aws s3 cp Builds/macOS/SmolbeanPlanet.dmg s3://dantelore.com/smolbeanplanet/mac/SmolbeanPlanet.dmg --cache-control "public,max-age=60"

      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[?@=='dantelore.com']].Id | [0]" \
            --output text)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/smolbeanplanet/*"
